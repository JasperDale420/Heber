services:
  # Infrastructure
  # Note: user directives skip the entrypoint's find/chown step, avoiding
  # "Operation not permitted" errors from macOS ._* resource fork files on
  # the external drive (exFAT/NTFS).
  postgres:
    image: postgres:16-alpine
    container_name: heber-postgres
    user: "70:70" # postgres:postgres — skips root chown on startup
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heber_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-heber_catalog}
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/postgres/data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-heber} -d $${POSTGRES_DB:-heber_catalog}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  # Heber Services
  heber-catalog:
    build:
      context: ..
      dockerfile: Heber/Dockerfile
    container_name: heber-catalog
    command: [ "python", "-m", "uvicorn", "heber.catalog.api:app", "--host", "0.0.0.0", "--port", "8080" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:${POSTGRES_PASSWORD:-heber_dev_password}@postgres:5432/heber_catalog
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  heber-consumer:
    build:
      context: ..
      dockerfile: Heber/Dockerfile
    container_name: heber-consumer
    command: [ "python", "-m", "heber.writer.consumer" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:${POSTGRES_PASSWORD:-heber_dev_password}@postgres:5432/heber_catalog
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
      - HEBER_REDIS_STREAM_NAME=heber:events
      - HEBER_REDIS_CONSUMER_GROUP=heber-writers
      - HEBER_REDIS_READ_BATCH_SIZE=2000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      heber-catalog:
        condition: service_healthy
    healthcheck:
      # Liveness via the consumer's own run-loop heartbeat gauge on :9090 — fails if the
      # event loop has not ticked in 180s (a stalled-but-running consumer). Makes
      # deploy.sh's health wait meaningful instead of "no healthcheck -> instantly ok".
      test: [ "CMD-SHELL", "python -c \"import urllib.request,time,re,sys; b=urllib.request.urlopen('http://localhost:9090/',timeout=5).read().decode(); m=re.search(r'^heber_consumer_loop_heartbeat_unixtime (\\S+)',b,re.M); sys.exit(0 if m and time.time()-float(m.group(1))<180 else 1)\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  # Dedicated consumer for the backfill stream, isolated from the live heber-consumer so a
  # multi-year UW backfill flood (Data-Gateway uw_backfill_driver.py publishes here by default)
  # can never fill the live heber:events stream to MAXLEN and evict un-read live feeds. Same
  # writer code as heber-consumer — only the source stream + consumer group differ.
  heber-backfill-consumer:
    build:
      context: ..
      dockerfile: Heber/Dockerfile
    container_name: heber-backfill-consumer
    command: [ "python", "-m", "heber.writer.consumer" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:${POSTGRES_PASSWORD:-heber_dev_password}@postgres:5432/heber_catalog
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
      - HEBER_REDIS_STREAM_NAME=heber:events:backfill
      - HEBER_REDIS_CONSUMER_GROUP=heber-backfill-writers
      - HEBER_REDIS_READ_BATCH_SIZE=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "127.0.0.1:9095:9090"
    depends_on:
      postgres:
        condition: service_healthy
      heber-catalog:
        condition: service_healthy
    healthcheck:
      # Same run-loop heartbeat liveness as heber-consumer (gauge on :9090, fresh even on idle
      # no-data cycles). Fails if the loop has not ticked in 180s.
      test: [ "CMD-SHELL", "python -c \"import urllib.request,time,re,sys; b=urllib.request.urlopen('http://localhost:9090/',timeout=5).read().decode(); m=re.search(r'^heber_consumer_loop_heartbeat_unixtime (\\S+)',b,re.M); sys.exit(0 if m and time.time()-float(m.group(1))<180 else 1)\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  heber-compactor:
    build:
      context: ..
      dockerfile: Heber/Dockerfile
    container_name: heber-compactor
    # Ceiling makes kills observable: with no limit, VM-level OOM kills are
    # silent (no OOMKilled flag, no exit code survives) — 6 such deaths the
    # week of Jul 6, two mid-compaction of ~3070-file massive_taq partitions.
    mem_limit: 2g
    command: [ "python", "-m", "heber.writer.compactor" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:${POSTGRES_PASSWORD:-heber_dev_password}@postgres:5432/heber_catalog
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  # Watch Service - Tracks flow alert outcomes for ML labeling
  heber-watch:
    build:
      context: ..
      dockerfile: Heber/Dockerfile
    container_name: heber-watch
    command: [ "python", "-m", "heber.watch" ]
    environment:
      # Uses heber:events stream from Data Gateway's Redis
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
      - DATA_GATEWAY_URL=http://host.docker.internal:8080
      - HEBER_WATCH_GATEWAY_API_KEY=${HEBER_WATCH_GATEWAY_API_KEY}
      - HEBER_WATCH_GATEWAY_LEGACY_FALLBACK_ENABLED=false
      - HEBER_GOLD_PATH=/data/gold
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      heber-catalog:
        condition: service_healthy
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  # Gold Feature Poller - Refreshes Gold feature datasets after market close
  heber-gold-poller:
    build:
      context: ..
      dockerfile: Heber/Dockerfile
    container_name: heber-gold-poller
    # Ceiling makes kills observable (see compactor note). market_regime's
    # nightly exitcode=-9 deaths were unattributable without a cgroup.
    mem_limit: 3g
    command: [ "python", "-m", "heber.gold_poller" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_GOLD_POLLER_ENABLED=true
      - HEBER_GOLD_POLLER_EOD_HOUR=16
      - HEBER_GOLD_POLLER_EOD_MINUTE=35
      # EOD reconcile re-pulls missing daily feeds through the Data-Gateway, which
      # runs on a separate compose network — reach it over the host bridge and send
      # the same gateway key heber-watch uses (from .env, never committed). Without
      # these the reconcile POST cannot resolve/authenticate and every backfill fails.
      - DATA_GATEWAY_URL=http://host.docker.internal:8080
      - HEBER_WATCH_GATEWAY_API_KEY=${HEBER_WATCH_GATEWAY_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "127.0.0.1:9092:9091"
    depends_on:
      heber-catalog:
        condition: service_healthy
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  heber-dataflow-health:
    build:
      context: ..
      dockerfile: Heber/Dockerfile
    container_name: heber-dataflow-health
    command: [ "python", "-m", "heber.ops.dataflow_health", "--loop", "--mode", "scheduled" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
      - HEBER_REDIS_STREAM_NAME=heber:events
      - HEBER_REDIS_CONSUMER_GROUP=heber-writers
      - HEBER_HEALTH_CONSUMER_METRICS_URL=http://heber-consumer:9090/metrics
      - HEBER_HEALTH_WATCH_METRICS_URL=http://heber-watch:9090/metrics
      - HEBER_HEALTH_CATALOG_URL=http://heber-catalog:8080/health
      # Off-machine dead-man heartbeat (healthchecks.io-style). Set in .env;
      # empty disables. See heber/config.py heartbeat_url.
      - HEBER_HEARTBEAT_URL=${HEBER_HEARTBEAT_URL:-}
      - HEBER_HEALTH_FRESHNESS_SECONDS=900
      - HEBER_HEALTH_INTERVAL_SECONDS=300
      - HEBER_HEALTH_REPORT_DIR=/data/ops/dataflow-health
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    depends_on:
      heber-consumer:
        condition: service_started
      heber-watch:
        condition: service_started
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  # Data Health Monitor — tiered data quality monitoring
  heber-health-monitor:
    build:
      context: ..
      dockerfile: Heber/Dockerfile
    container_name: heber-health-monitor
    # Ceiling makes kills observable (see compactor note). 32 silent deaths
    # the week of Jul 6, ~hourly during market hours.
    mem_limit: 1500m
    command: [ "python", "-m", "heber.health_monitor" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
      - HEBER_REDIS_STREAM_NAME=heber:events
      - HEBER_REDIS_CONSUMER_GROUP=heber-writers
      - HEBER_HEALTH_MONITOR_ENABLED=true
      - HEBER_HEALTH_STREAM_CHECK_INTERVAL_SECONDS=30
      - HEBER_HEALTH_PARTITION_CHECK_INTERVAL_SECONDS=900
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      heber-consumer:
        condition: service_started
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: always

  # Uncomment to run DLQ reprocessor as a one-shot service:
  # heber-dlq-reprocessor:
  #   build:
  #     context: ..
  #     dockerfile: Heber/Dockerfile
  #   container_name: heber-dlq-reprocessor
  #   command: [ "python", "-m", "heber.writer.dlq_reprocessor", "--analyze" ]
  #   environment:
  #     - HEBER_DATA_ROOT=/data
  #     - HEBER_REDIS_URL=redis://host.docker.internal:6379
  #     - HEBER_REDIS_DLQ_STREAM_NAME=heber:events:dlq
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   volumes:
  #     - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
  #   depends_on:
  #     heber-consumer:
  #       condition: service_started
  #   restart: "no"
  #
  #   # Example: reprocess only insider_trades feed
  #   # command: [ "python", "-m", "heber.writer.dlq_reprocessor", "--reprocess", "--feed", "insider_trades", "--batch-size", "500" ]
  #
  #   # Example: purge entries older than 30 days
  #   # command: [ "python", "-m", "heber.writer.dlq_reprocessor", "--purge", "--older-than", "30d", "--confirm" ]

volumes:
  heber-data:
    driver: local
