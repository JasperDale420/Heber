services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: heber-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heber_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-heber_catalog}
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/postgres/data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U heber -d heber_catalog" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: heber-redis
    command: redis-server --appendonly yes
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/redis/data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: heber-clickhouse
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/clickhouse/data:/var/lib/clickhouse
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/clickhouse/logs:/var/log/clickhouse-server
    ports:
      - "8124:8123" # HTTP
      - "9002:9000" # Native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # OSS Infrastructure (Phase 1-5 Migration)
  # =============================================================================

  # MinIO - S3-compatible object storage for Iceberg and lakeFS
  minio:
    image: minio/minio:latest
    container_name: heber-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/minio/data:/data
    ports:
      - "19000:9000" # S3 API
      - "19001:9001" # Console
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # lakeFS - Git for data (Phase 2)
  lakefs:
    image: treeverse/lakefs:latest
    container_name: heber-lakefs
    environment:
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_SECRET_KEY:-some-random-secret-key-min-32-chars}
      LAKEFS_DATABASE_TYPE: postgres
      LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING: postgresql://heber:heber_dev_password@postgres:5432/heber_lakefs?sslmode=disable # pragma: allowlist secret
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8000:8000" # lakeFS API
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Apicurio Registry - Schema Registry (Phase 4)
  # Note: Karapace requires Kafka; Apicurio supports PostgreSQL standalone mode
  apicurio-registry:
    image: apicurio/apicurio-registry-sql:2.5.11.Final
    container_name: heber-apicurio
    environment:
      REGISTRY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/heber_apicurio
      REGISTRY_DATASOURCE_USERNAME: heber
      REGISTRY_DATASOURCE_PASSWORD: heber_dev_password # pragma: allowlist secret
      QUARKUS_HTTP_PORT: 8081
      QUARKUS_LOG_LEVEL: INFO
    ports:
      - "18081:8081" # Schema Registry API (Confluent-compatible at /api/ccompat/v7)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # OpenMetadata - Data Catalog (Phase 5)
  openmetadata:
    image: openmetadata/server:1.4.0
    container_name: heber-openmetadata
    environment:
      OPENMETADATA_CLUSTER_NAME: heber
      SERVER_HOST_API_URL: http://localhost:8585/api
      SERVER_ADMIN_PORT: 8586
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
      # Database
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: heber
      DB_USER_PASSWORD: heber_dev_password # pragma: allowlist secret
      OM_DATABASE: heber_openmetadata
      # Elasticsearch (embedded for dev)
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
    ports:
      - "8585:8585" # OpenMetadata UI
      - "8586:8586" # Admin API
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Elasticsearch for OpenMetadata search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: heber-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/elasticsearch/data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Heber Services
  heber-catalog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heber-catalog
    command: [ "python", "-m", "uvicorn", "heber.catalog.api:app", "--host", "0.0.0.0", "--port", "8080" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:heber_dev_password@postgres:5432/heber_catalog
      - HEBER_REDIS_URL=redis://redis:6379
      - HEBER_CLICKHOUSE_HOST=clickhouse
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  heber-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heber-consumer
    command: [ "python", "-m", "heber.writer.consumer" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:heber_dev_password@postgres:5432/heber_catalog
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
      - HEBER_REDIS_STREAM_NAME=heber:events
      - HEBER_REDIS_CONSUMER_GROUP=heber-writers
      - HEBER_CLICKHOUSE_HOST=clickhouse
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    depends_on:
      postgres:
        condition: service_healthy
      heber-catalog:
        condition: service_healthy
    restart: unless-stopped

  heber-compactor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heber-compactor
    command: [ "python", "-m", "heber.writer.compactor" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:heber_dev_password@postgres:5432/heber_catalog
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  heber-data:
    driver: local
