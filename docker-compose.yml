services:
  # Infrastructure
  # Note: user directives skip the entrypoint's find/chown step, avoiding
  # "Operation not permitted" errors from macOS ._* resource fork files on
  # the external drive (exFAT/NTFS).
  postgres:
    image: postgres:16-alpine
    container_name: heber-postgres
    user: "70:70" # postgres:postgres — skips root chown on startup
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heber_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-heber_catalog}
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/postgres/data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-heber} -d $${POSTGRES_DB:-heber_catalog}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # =============================================================================
  # OSS Infrastructure (Phase 1-5 Migration)
  # =============================================================================

  # MinIO - S3-compatible object storage for Iceberg and lakeFS
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: heber-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/minio/data:/data
    ports:
      - "19000:9000" # S3 API
      - "19001:9001" # Console
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # lakeFS - Git for data (Phase 2)
  lakefs:
    image: treeverse/lakefs:1.48.0
    container_name: heber-lakefs
    environment:
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_SECRET_KEY:-some-random-secret-key-min-32-chars}
      LAKEFS_DATABASE_TYPE: postgres
      LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING: postgresql://heber:heber_dev_password@postgres:5432/heber_lakefs?sslmode=disable # pragma: allowlist secret
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "8000:8000" # lakeFS API
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8000/api/v1/healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # Apicurio Registry - Schema Registry (Phase 4)
  # Note: Karapace requires Kafka; Apicurio supports PostgreSQL standalone mode
  apicurio-registry:
    image: apicurio/apicurio-registry-sql:2.5.11.Final
    container_name: heber-apicurio
    environment:
      REGISTRY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/heber_apicurio
      REGISTRY_DATASOURCE_USERNAME: heber
      REGISTRY_DATASOURCE_PASSWORD: heber_dev_password # pragma: allowlist secret
      QUARKUS_HTTP_PORT: 8081
      QUARKUS_LOG_LEVEL: INFO
    ports:
      - "18081:8081" # Schema Registry API (Confluent-compatible at /api/ccompat/v7)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # Heber Services
  heber-catalog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heber-catalog
    command: [ "python", "-m", "uvicorn", "heber.catalog.api:app", "--host", "0.0.0.0", "--port", "8080" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:heber_dev_password@postgres:5432/heber_catalog
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  heber-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heber-consumer
    command: [ "python", "-m", "heber.writer.consumer" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:heber_dev_password@postgres:5432/heber_catalog
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
      - HEBER_REDIS_STREAM_NAME=heber:events
      - HEBER_REDIS_CONSUMER_GROUP=heber-writers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      heber-catalog:
        condition: service_healthy
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  heber-compactor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heber-compactor
    command: [ "python", "-m", "heber.writer.compactor" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_POSTGRES_URL=postgresql+asyncpg://heber:heber_dev_password@postgres:5432/heber_catalog
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # Watch Service - Tracks flow alert outcomes for ML labeling
  heber-watch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heber-watch
    command: [ "python", "-m", "heber.watch" ]
    environment:
      # Uses heber:events stream from Data Gateway's Redis
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
      - DATA_GATEWAY_URL=http://host.docker.internal:8081
      - HEBER_WATCH_GATEWAY_API_KEY=${HEBER_WATCH_GATEWAY_API_KEY:-gw_orion_trading_key_55555}
      - HEBER_WATCH_GATEWAY_LEGACY_FALLBACK_ENABLED=false
      - HEBER_GOLD_PATH=/data/gold/labels_alert_barriers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    ports:
      - "9091:9090"
    depends_on:
      heber-catalog:
        condition: service_healthy
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  heber-dataflow-health:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heber-dataflow-health
    command: [ "python", "-m", "heber.ops.dataflow_health", "--loop", "--mode", "scheduled" ]
    environment:
      - HEBER_DATA_ROOT=/data
      - HEBER_REDIS_URL=redis://host.docker.internal:6379
      - HEBER_REDIS_STREAM_NAME=heber:events
      - HEBER_REDIS_CONSUMER_GROUP=heber-writers
      - HEBER_HEALTH_CONSUMER_METRICS_URL=http://heber-consumer:9090/metrics
      - HEBER_HEALTH_WATCH_METRICS_URL=http://heber-watch:9090/metrics
      - HEBER_HEALTH_FRESHNESS_SECONDS=900
      - HEBER_HEALTH_INTERVAL_SECONDS=300
      - HEBER_HEALTH_REPORT_DIR=/data/ops/dataflow-health
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HEBER_VOLUME_ROOT:-/Volumes/heber}/data:/data
    depends_on:
      heber-consumer:
        condition: service_started
      heber-watch:
        condition: service_started
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

volumes:
  heber-data:
    driver: local
