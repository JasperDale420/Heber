[project]
name = "heber"
version = "0.1.0"
description = "Heber Data Lakehouse - Centralized storage for market and intelligence data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # API
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",

    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Data processing
    "pandas>=2.0",
    "pyarrow>=15.0",
    "polars>=0.20",

    # Event bus
    "redis>=5.0",

    # Hot Store
    "clickhouse-connect>=0.7",

    # Feature Store
    "feast>=0.38",

    # Table Format (Phase 1: Iceberg)
    "pyiceberg[s3,pyarrow]>=0.7",

    # Data Quality (Phase 3: Soda Core)
    "soda-core-duckdb>=3.0",

    # Observability
    "structlog>=24.0",
    "prometheus-client>=0.19",

    # Utils
    "httpx>=0.26",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "bandit>=1.7",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Ignore some stricter rules for pre-existing code patterns
ignore = [
    "B008",  # Function call in argument defaults (common in FastAPI)
    "B904",  # raise ... from err (requires code refactor)
    "E402",  # Module level import not at top of file (intentional in some modules)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # Skip assert warnings in tests
