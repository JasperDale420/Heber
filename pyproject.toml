[project]
name = "heber"
version = "0.2.0"
description = "Heber Data Lakehouse - Centralized storage for market and intelligence data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Empire shared packages
    "empire-core",
    "empire-schemas",

    # Core
    "pydantic>=2.5",
    "pydantic-settings>=2.0",

    # API
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.27",

    # Database
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.13",

    # Data processing
    "boto3>=1.34",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "duckdb>=1.1.0",

    # Event bus
    "redis>=5.0",
    "nats-py==2.15.0",

    # Feature Store
    "feast>=0.38",

    # Data Quality (Soda Core)
    "soda-core-duckdb>=3.0",


    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.19",

    # Utils
    "httpx>=0.27",
    "tenacity>=8.2",
    "joblib>=1.3",
    "filelock>=3.13",

    # Trading calendar (market hours, holidays)
    "exchange-calendars>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "bandit>=1.7",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
]


# Lightweight reader-only install: pip install heber[reader]
# For external consumers who only need the filesystem reader
reader = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
]

[project.scripts]
heber = "heber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend = "ruff-base.toml"
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Ignore some stricter rules for pre-existing code patterns
ignore = [
    "B008",  # Function call in argument defaults (common in FastAPI)
    "B904",  # raise ... from err (requires code refactor)
    "E402",  # Module level import not at top of file (intentional in some modules)
]

[tool.pytest.ini_options]
testpaths = ["tests", "heber"]
python_files = ["test_*.py", "*_test.py", "tests.py", "tests_*.py"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Fast, isolated unit tests (no I/O, no network)",
    "integration: Tests with real DB, file I/O, or component interactions",
    "e2e: End-to-end full system flow tests",
    "slow: Tests that take >1s (opt-in, excluded by default)",
]

[tool.coverage.run]
branch = true
source = ["heber"]
omit = ["tests/*", "scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["heber.reader.*", "heber.config"]
strict = true

[[tool.mypy.overrides]]
module = [
    "heber.core.*",
    "heber.universe.*",
    "heber.utils.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "pyarrow",
    "pyarrow.*",
    "soda.*",
    "lakefs",
    "lakefs.*",
    "exchange_calendars",
    "exchange_calendars.*",
    "feast",
    "feast.*",
    "pyiceberg",
    "pyiceberg.*",
    "joblib",
    "joblib.*",
    "filelock",
    "filelock.*",
    "lightgbm",
    "lightgbm.*",
    "sklearn",
    "sklearn.*",
    "mlflow",
    "mlflow.*",
    "numpy",
    "numpy.*",
    "redis",
    "redis.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # Skip assert warnings in tests

[tool.uv.sources]
empire-core = { path = "../empire-core", editable = true }
empire-schemas = { path = "../empire-schemas", editable = true }
