# =============================================================================
# Heber Compactor Deployment per PRD §20.2
# =============================================================================
# Resources:
#   CPU: 1000m request, 4000m limit
#   Memory: 2Gi request, 8Gi limit
#   Replicas: 1 (single instance for partition locking)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: heber-compactor
  labels:
    app.kubernetes.io/name: heber-compactor
    app.kubernetes.io/component: compactor
spec:
  replicas: 1
  strategy:
    type: Recreate  # Only one compactor at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: heber-compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heber-compactor
        app.kubernetes.io/component: compactor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: heber
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: compactor
          image: heber:compactor-latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "heber.writer.compactor"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: heber-config
            - secretRef:
                name: heber-secrets
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import pathlib,sys; sys.exit(0 if b'heber.writer.compactor' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import pathlib,sys; sys.exit(0 if b'heber.writer.compactor' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi  # Temp space for compaction
