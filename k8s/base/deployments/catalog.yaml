# =============================================================================
# Heber Catalog API Deployment per PRD §20.2
# =============================================================================
# Resources:
#   CPU: 250m request, 1000m limit
#   Memory: 256Mi request, 1Gi limit
#   Replicas: 2 (prod)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: heber-catalog
  labels:
    app.kubernetes.io/name: heber-catalog
    app.kubernetes.io/component: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: heber-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heber-catalog
        app.kubernetes.io/component: catalog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: heber
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: catalog
          image: heber:catalog-latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "heber.catalog.api:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: heber-config
            - secretRef:
                name: heber-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
