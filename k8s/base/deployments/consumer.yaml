# =============================================================================
# Heber Consumer Deployment per PRD §20.2
# =============================================================================
# Resources:
#   CPU: 500m request, 2000m limit
#   Memory: 512Mi request, 2Gi limit
#   Replicas: 3 (prod)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: heber-consumer
  labels:
    app.kubernetes.io/name: heber-consumer
    app.kubernetes.io/component: consumer
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: heber-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heber-consumer
        app.kubernetes.io/component: consumer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: heber
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: consumer
          image: heber:consumer-latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "heber.writer.consumer"]
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: heber-config
            - secretRef:
                name: heber-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import pathlib,sys; sys.exit(0 if b'heber.writer.consumer' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import pathlib,sys; sys.exit(0 if b'heber.writer.consumer' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
