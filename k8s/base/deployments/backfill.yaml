# =============================================================================
# Heber Backfill Deployment per PRD §20.2
# =============================================================================
# Resources:
#   CPU: 500m request, 2000m limit
#   Memory: 1Gi request, 4Gi limit
#   Replicas: 1 (on-demand)
# Note: Typically scaled to 0 and activated for backfill jobs
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: heber-backfill
  labels:
    app.kubernetes.io/name: heber-backfill
    app.kubernetes.io/component: backfill
spec:
  replicas: 0  # Scaled up on-demand for backfill jobs
  selector:
    matchLabels:
      app.kubernetes.io/name: heber-backfill
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heber-backfill
        app.kubernetes.io/component: backfill
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: heber
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: backfill
          image: heber:backfill-latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "heber.backfill"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: heber-config
            - secretRef:
                name: heber-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
