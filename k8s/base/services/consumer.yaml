# Heber Consumer Service (internal, metrics only)
apiVersion: v1
kind: Service
metadata:
  name: heber-consumer
  labels:
    app.kubernetes.io/name: heber-consumer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heber-consumer
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
