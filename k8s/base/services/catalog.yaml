# Heber Catalog Service (HTTP API + metrics)
apiVersion: v1
kind: Service
metadata:
  name: heber-catalog
  labels:
    app.kubernetes.io/name: heber-catalog
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heber-catalog
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
