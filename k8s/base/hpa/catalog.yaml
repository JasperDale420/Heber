# Heber Catalog HorizontalPodAutoscaler per PRD §20.4
# Uses built-in resource metrics (CPU/memory) to avoid custom-metric drift.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heber-catalog-hpa
  labels:
    app.kubernetes.io/name: heber-catalog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heber-catalog
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
