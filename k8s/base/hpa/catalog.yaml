# Heber Catalog HorizontalPodAutoscaler per PRD §20.4
# Scales based on request latency P99
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: heber-catalog-hpa
  labels:
    app.kubernetes.io/name: heber-catalog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: heber-catalog
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Pods
      pods:
        metric:
          name: heber_catalog_request_latency_p99_seconds
        target:
          type: AverageValue
          averageValue: "0.5"  # 500ms threshold
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
