# =============================================================================
# SonarQube/SonarCloud Configuration for Heber Data Lakehouse
# =============================================================================
# Configure SONAR_TOKEN and SONAR_HOST_URL in GitHub Secrets.
# =============================================================================

# Project identification (REPLACE_ME values must be configured)
sonar.projectKey=REPLACE_ME_PROJECT_KEY
sonar.projectName=Heber Data Lakehouse
sonar.organization=REPLACE_ME_ORGANIZATION

# Source configuration
sonar.sources=heber
sonar.tests=tests
sonar.python.version=3.11

# Coverage configuration
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/tests/**
sonar.test.exclusions=**/tests/**

# Encoding
sonar.sourceEncoding=UTF-8
