# =============================================================================
# Heber CI Pipeline
# =============================================================================
# Stages: Build → Test → Scan (deployment is launchd + docker-compose on the
# host — see scripts/deploy.sh and docs/deployment-guide.md, not CI)
# Triggers: Push to master, PRs to master
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Build Stage per PRD §23.3
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create monorepo layout for Docker build
        run: |
          # Dockerfile expects parent context with Heber/ and empire-core/ siblings.
          # Restructure checkout into that layout and create dependency stubs.
          mkdir -p /tmp/build-ctx/Heber
          cp -r . /tmp/build-ctx/Heber/
          bash /tmp/build-ctx/Heber/.github/scripts/create-ci-stubs.sh
          # Stubs are now at /tmp/build-ctx/../empire-core — move them into build context
          mv ../empire-core /tmp/build-ctx/empire-core
          mv ../empire-schemas /tmp/build-ctx/empire-schemas

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build images (no push)
        uses: docker/build-push-action@v7
        with:
          context: /tmp/build-ctx
          file: /tmp/build-ctx/Heber/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Test Stage per PRD §23.4
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python and virtual environment
        run: |
          uv python install 3.12
          uv venv .venv --python 3.12
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Create monorepo sibling stubs
        run: bash .github/scripts/create-ci-stubs.sh

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Type check strict modules (mypy)
        run: mypy heber/reader heber/config.py heber/core heber/universe heber/utils

      - name: Security scan (bandit, high severity + high confidence)
        run: bandit -c pyproject.toml -r heber --severity-level high --confidence-level high

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=heber --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # SonarQube Analysis per PRD §19.5
  # ===========================================================================
  sonar:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for SonarQube analysis

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python and virtual environment
        run: |
          uv python install 3.12
          uv venv .venv --python 3.12
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Create monorepo sibling stubs
        run: bash .github/scripts/create-ci-stubs.sh

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ --cov=heber --cov-report=xml

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true  # Don't fail CI if SonarQube is not configured

  # ===========================================================================
  # Security Scan Stage per PRD §19.3 and §23.5
  # ===========================================================================
  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Run Trivy on Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
